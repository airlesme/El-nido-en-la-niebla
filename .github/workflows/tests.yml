name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run GdUnit4 Tests
    runs-on: ubuntu-latest
    # The action publishes its results as a check run; a new repository's token
    # is read-only, so checks: write is required. If you protect main, require
    # the `Run GdUnit4 Tests` job check, not `test-results` (that check run
    # concludes success even when a test fails).
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      # Preflight: gdUnit4 is NOT vendored by default. Without the addon the
      # action (version: installed) has nothing to run; fail loudly instead of
      # letting an empty run look like a pass. See tests/README.md.
      - name: Require committed gdUnit4 addon
        run: |
          if [ ! -f addons/gdUnit4/bin/GdUnitCmdTool.gd ]; then
            echo "::error::addons/gdUnit4/ is not committed (capital U). Install it per tests/README.md 'Installing GdUnit4'."
            exit 1
          fi

      # godot-version must be a full release (4.7.2), not VERSION.md's "4.7".
      # version: installed runs the gdUnit4 committed in addons/; without it the
      # action deletes that copy and installs the latest release.
      - name: Run GdUnit4 Tests
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.7.2'
          version: 'installed'
          paths: |
            tests/unit
            tests/integration
          report-name: test-results

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: reports/

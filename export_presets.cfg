; Godot 4 export presets for "El Nido en la Niebla" (ADR-0018 D1).
; NOT VERIFIED: nombres de propiedades hasta el primer export (ADR-0018 E3/E4).
;   Escrito de memoria; ningun doc de docs/engine-reference/godot/ cubre este formato.
;   Tras el primer export con las templates instaladas, abrir el editor una vez
;   (Project > Export) y diff: Godot reescribe el fichero con sus nombres reales.
; Modo de export NO vive en el preset: playtest-* -> --export-debug, demo-* -> --export-release
;   (lo fija tools/build/export.ps1|sh; ADR-0018 D1.3).
; Solo demo-* excluye src/dev/* (D1.2). Sin firma, sin clave PCK, sin credenciales (D1.1).
; Salida: build/<preset>/ (gitignored). PCK separado (embed_pck=false, D1.5).
; Un preset demo-* sin "src/dev/*" en exclude_filter lo detecta check_dev_isolation (D4 capa 1).

[preset.0]

name="playtest-windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,tools/*,prototypes/*,addons/gdUnit4/*,design/*,docs/*,production/*,reports/*,.claude/*"
export_path="build/playtest-windows/el-nido.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false


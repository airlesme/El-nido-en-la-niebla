#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: scene_load_max_duration
    status: active
    source: design/gdd/escena-de-planta.md
    referenced_by:
      - design/gdd/escena-de-planta.md
      - design/gdd/entrada-y-controles.md   # F8: el tope de sin control de una carga es esta duración más un margen (cambio pendiente en ese GDD)
    variables:
      - d_out
      - scene_load_timeout
      - N_gap
      - d_in
    output_range: [3, 40.4]
    expression: "D_carga = d_out + T_cap + N_gap * dt_ref + d_in"
    notes: "Duración máxima declarada a Entrada para el sin control de una carga de escena. Con los valores propuestos (recepcion) ≈ 11,67 s."
    added: 2026-11-08
    revised: ""
  # --- Lote 2026-11-09 ---
  - name: player_ground_velocity
    status: active
    source: design/gdd/jugador-en-primera-persona.md
    referenced_by: []
    variables: [v_paseo, m, k_lat, k_atras]
    output_range: [0, 1.6]
    expression: "v_obj = v_paseo * (m'.x*k_lat, m'.y*(m'.y>=0 ? 1 : k_atras)); m' = m / max(1,|m|)"
    notes: "Hacia atrás 1,28 m/s"
    added: 2026-11-09
    revised: ""
  - name: player_effective_fov
    status: active
    source: design/gdd/jugador-en-primera-persona.md
    referenced_by: [design/art/art-bible.md, design/gdd/interaccion-e-inspeccion.md]
    variables: [fov_v, aspect, fov_h_max]
    output_range: [51.9, 90]
    expression: "h = 2*atan(tan(fov_v/2)*aspect); if h > 120deg then fov_v = 2*atan(tan(60deg)/aspect)"
    notes: "El fov_destino de una cesión de cámara también pasa por fov_h_max; 7 lo lee con fov_vigente()"
    added: 2026-11-09
    revised: ""
  - name: player_camera_bob_offset
    status: active
    source: design/gdd/jugador-en-primera-persona.md
    referenced_by: []
    variables: [A_v, A_h, g, r, d, L_paso]
    output_range: [0, 0.015]
    expression: "y = A_v*g*r*cos(2*pi*d/L_paso); x = A_h*g*r*sin(pi*d/L_paso); translation only"
    notes: "|y| <= 0,015 m, |x| <= 0,010 m"
    added: 2026-11-09
    revised: ""
  - name: player_pose_delayed
    status: active
    source: design/gdd/jugador-en-primera-persona.md
    referenced_by: []
    variables: [T_hist, f_fisica, tau]
    output_range: [0, 1.0]
    expression: "lerp over ring buffer N = ceil(T_hist*f_fisica)+2; s = tau*f_fisica; i = min(floor(s), N-2)"
    notes: "tau in [0, T_hist]; el +2 es el margen del búfer (revisión del GDD 2)"
    added: 2026-11-09
    revised: ""
  - name: F6_ppm
    status: active
    source: design/gdd/interaccion-e-inspeccion.md
    referenced_by: [design/gdd/entrada-y-controles.md]
    variables: [H, d, FOV_v]
    output_range: [0, 10000]
    expression: "(H/2)/(d*tan(FOV_v/2))"
    notes: "2.203 px/m en D01a (H = 1080); equivalencia píxeles-metros para F5b de Entrada"
    added: 2026-11-09
    revised: ""

